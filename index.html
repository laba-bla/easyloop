function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || "#7c5cff"; }
function ledColorFor(p){
  const arr=["#7c5cff","#ff5c8a","#5cd0ff","#ffc85c","#8cff5c"];
  return arr[Math.floor(p*arr.length)%arr.length];
}
let audioLevel=0;
function getAudioLevel(){
  if(!STATE.analyser) return 0;
  const arr = new Uint8Array(STATE.analyser.frequencyBinCount);
  STATE.analyser.getByteFrequencyData(arr);
  let s=0; for(let v of arr) s+=v;
  return Math.min(1, s/arr.length/255 * 2.5); // 放大一点让轻触也看得见
}

/* ---------------- 波纹实时频谱：真实频谱取样 + 静音回退 ----------------
   真实数据来自 STATE.specAnalyser（fftSize 2048）。钢琴基频与泛音集中在 40Hz~8kHz，
   所以按对数分频取样，低频段给足带宽；整段几乎全黑时判定为静音，回退到前端模拟，
   保证没在弹的时候画面也不会是一片死水。两者之间做平滑过渡，避免 LIVE/SIM 闪烁。 */
const SPEC_BANDS = 56;
let _specBuf=null;
const _specReal = new Float32Array(SPEC_BANDS);
const _specSim  = new Float32Array(SPEC_BANDS);
const _specOut  = new Float32Array(SPEC_BANDS);
const _specPrev = new Float32Array(SPEC_BANDS);
const _ringPh   = new Float32Array(SPEC_BANDS);
const _ringSeed = new Float32Array(SPEC_BANDS);
let _specLive = 0, _lastSpecT = 0;
const _splash = [];
for(let i=0;i<SPEC_BANDS;i++) _ringSeed[i] = Math.random()*6.283;

/* 画布底色其实是 --text（浅色主题下是深靛蓝，深色主题下反过来），据此决定高光取白还是取深色 */
function canvasIsDark(){
  const v = getCss("--text");
  let r=0,g=0,b=0;
  if(v.charAt(0)==="#"){
    const h = v.length===4 ? v[1]+v[1]+v[2]+v[2]+v[3]+v[3] : v.slice(1,7);
    r=parseInt(h.slice(0,2),16)||0; g=parseInt(h.slice(2,4),16)||0; b=parseInt(h.slice(4,6),16)||0;
  } else {
    const m = v.match(/\d+/g); if(m){ r=+m[0]; g=+m[1]; b=+m[2]; }
  }
  return (r*0.299+g*0.587+b*0.114) < 140;
}

function sampleSpectrumBands(t){
  const an = STATE.specAnalyser;
  let real = false;
  if(an){
    const n = an.frequencyBinCount;
    if(!_specBuf || _specBuf.length!==n) _specBuf = new Uint8Array(n);
    an.getByteFrequencyData(_specBuf);
    const half = (STATE.audio ? STATE.audio.sampleRate : 44100)/2;
    const f0 = 40, f1 = 8000;
    let sum = 0;
    for(let i=0;i<SPEC_BANDS;i++){
      const hz = f0*Math.pow(f1/f0, i/(SPEC_BANDS-1));
      let b0 = Math.round(hz*0.92/half*n), b1 = Math.round(hz*1.08/half*n);
      if(b0<0) b0=0; if(b1>n) b1=n; if(b1<=b0) b1=b0+1;
      let m = 0;
      for(let b=b0;b<b1;b++) if(_specBuf[b]>m) m = _specBuf[b];
      _specReal[i] = m/255;
      sum += m;
    }
    real = (sum/SPEC_BANDS/255) > 0.04;
  }
  // 进入实时快、退回模拟慢，过渡更自然
  _specLive += ((real?1:0) - _specLive) * (real?0.22:0.045);

  for(let i=0;i<SPEC_BANDS;i++){
    const p = i/(SPEC_BANDS-1);
    const env = Math.pow(1-p,1.75)*0.92 + 0.05;   // 低频强、高频弱，接近真实音乐的谱型
    const w1 = 0.5+0.5*Math.sin(t*(1.7+p*4.6) + p*12 + _ringSeed[i]*0.3);
    const w2 = 0.5+0.5*Math.sin(t*(3.4-p*1.6) + p*27);
    _specSim[i] = Math.min(1, env*(0.30+0.62*w1)*(0.45+0.55*w2)*2.1 + 0.02);
  }
  const w = _specLive;
  for(let i=0;i<SPEC_BANDS;i++) _specOut[i] = _specReal[i]*w + _specSim[i]*(1-w);
  return _specOut;
}

/* 颜色工具：五色调色板平滑插值（消除色块交界）+ RGBA 转换 */
function lerpColor(p){
  const arr=[[124,92,255],[255,92,138],[92,208,255],[255,200,92],[140,255,92]];
  const x=Math.min(.9999,Math.max(0,p))*(arr.length-1);
  const i=Math.floor(x), f=x-i;
  const a=arr[i], b=arr[Math.min(i+1,arr.length-1)];
  return [Math.round(a[0]+(b[0]-a[0])*f), Math.round(a[1]+(b[1]-a[1])*f), Math.round(a[2]+(b[2]-a[2])*f)];
}
function rgba(c,a){ return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")"; }
function mixWhite(c,f){ return [Math.round(c[0]+(255-c[0])*f), Math.round(c[1]+(255-c[1])*f), Math.round(c[2]+(255-c[2])*f)]; }

/* 九种可视化绘制器 */
const VIZ_DRAW = {
  /* 渐变频谱条 + 峰值帽：色相横向平滑过渡，柱身同色相明暗渐变 */
  spectrum(ctx,W,H,t){
    const bars=56, bw=W/bars;
    if(!STATE.vizPeaks || STATE.vizPeaks.length!==bars) STATE.vizPeaks = new Array(bars).fill(0);
    for(let i=0;i<bars;i++){
      const v = (Math.sin(t*3+i*0.4)*0.5+0.5)*(Math.sin(i*0.7+t)*0.4+0.6);
      const h = Math.max(6, v*(H-50)*(0.25+audioLevel*0.75));
      const col = lerpColor(i/(bars-1));
      const g = ctx.createLinearGradient(0,H,0,H-h);
      g.addColorStop(0, rgba(col,.28));
      g.addColorStop(.72, rgba(col,1));
      g.addColorStop(1, rgba(mixWhite(col,.45),1));
      ctx.fillStyle = g;
      ctx.shadowColor = rgba(col,.9); ctx.shadowBlur = 10;
      ctx.fillRect(i*bw+2, H-h, bw-4, h);
      ctx.shadowBlur = 0;
      const pk = STATE.vizPeaks;
      pk[i] = Math.max(h, (pk[i]||0)-1.6);
      ctx.fillStyle = getCss("--bg"); ctx.globalAlpha=.9;
      ctx.fillRect(i*bw+2, H-pk[i]-7, bw-4, 3);
      ctx.globalAlpha=1;
    }
  },
  /* 复合波形：回声层 + 主波辉光 + 波峰粒子 */
  wave(ctx,W,H,t){
    const c3=getCss("--led3"), c1=getCss("--led1");
    for(let e=2;e>=0;e--){
      ctx.strokeStyle = e===0? c3 : c1;
      ctx.globalAlpha = e===0? 1 : 0.28;
      ctx.lineWidth = e===0? 4 : 2;
      ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = e===0? 18:6;
      ctx.beginPath();
      for(let x=0;x<=W;x+=3){
        const y = H/2 + Math.sin(x*0.018 + t*3 - e*0.35)*70*(0.35+audioLevel*1.65)*Math.sin(t*1.1)
                      + Math.sin(x*0.045 - t*2 + e)*18;
        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    for(let i=0;i<40;i++){
      const x=(i/40)*W;
      const y=H/2 + Math.sin(x*0.018+t*3)*70*(0.35+audioLevel*1.65)*Math.sin(t*1.1);
      ctx.fillStyle=ledColorFor(i/40); ctx.globalAlpha=.5+.5*Math.abs(Math.sin(t*4+i));
      ctx.fillRect(x-2,y-2,4,4);
    }
    ctx.globalAlpha=1;
  },
  /* 粒子海浪 */
  particles(ctx,W,H,t){
    for(let i=0;i<140;i++){
      const x=(i*53 + t*22*(1+(i%3)))%W;
      const y=H/2 + Math.sin(i*0.3 + t*2)*60 + Math.cos(i*0.1+t)*30;
      ctx.fillStyle = ledColorFor(i/140);
      ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=8;
      ctx.globalAlpha=.55+.45*Math.abs(Math.sin(t*3+i));
      ctx.fillRect(x, y, 4,4);
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    ctx.strokeStyle=getCss("--led2"); ctx.lineWidth=3; ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=12;
    ctx.beginPath();
    for(let x=0;x<W;x+=4){ const y=H/2 + Math.sin(x*0.02+t*3)*70*(0.35+audioLevel*1.65); if(x===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);} ctx.stroke();
    ctx.shadowBlur=0;
  },
  /* 金色音符流：流动五线谱 + 音符字符 */
  notes(ctx,W,H,t){
    const gold=getCss("--led4");
    for(let j=0;j<5;j++){
      ctx.strokeStyle=gold; ctx.globalAlpha=.3; ctx.lineWidth=1.5;
      ctx.beginPath();
      for(let x=0;x<=W;x+=4){
        const y=H/2+(j-2)*22 + Math.sin(x*0.012 + t*1.6 + j*0.4)*26;
        if(x===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    const glyphs=["♪","♫","♩","♬"];
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(let i=0;i<16;i++){
      const s=((i/16)+t*0.045)%1;
      const x=s*W;
      const y=H/2 + Math.sin(s*9.4+t*1.6)*38 + Math.sin(i*1.7)*8;
      const sz=16+10*(0.5+0.5*Math.sin(i*2.3+t));
      ctx.font=sz+"px serif";
      ctx.fillStyle=gold; ctx.globalAlpha=.5+.5*Math.sin(s*Math.PI);
      ctx.shadowColor=gold; ctx.shadowBlur=14;
      ctx.fillText(glyphs[i%4], x, y);
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
  },
  /* 水纹扩散：暗色池塘 + 同心涟漪 + 多点落珠 + 水面起伏 */
  ripple(ctx,W,H,t){
    const cy = H*0.56, squash = 0.36, maxR = Math.min(W,H)*0.72;
    const blue = getCss("--led3"), deep = getCss("--led1");
    // 水面起伏：透视横纹
    for(let row=0; row<12; row++){
      const p = row/11;
      const y0 = H*0.34 + p*(H*0.52);
      ctx.strokeStyle = blue; ctx.globalAlpha = .05+.1*p; ctx.lineWidth = 1;
      ctx.beginPath();
      for(let x=0;x<=W;x+=6){
        const y = y0 + Math.sin(x*0.028 + t*1.6 + row*1.3)*(1.5+4*p) + Math.sin(x*0.008 - t*0.9)*2*p;
        if(x===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // 涟漪绘制器：波纹圈（半径带扰动 → 像真实水纹）
    function ring(x, y, phase, hue){
      const r = 8 + phase*maxR;
      const alpha = (1-phase)*(1-phase)*0.95;
      ctx.strokeStyle = hue; ctx.globalAlpha = alpha;
      ctx.lineWidth = 1 + (1-phase)*2.2;
      ctx.shadowColor = blue; ctx.shadowBlur = 10*(1-phase)+2;
      ctx.beginPath();
      for(let a=0;a<=64;a++){
        const ang = (a/64)*Math.PI*2;
        const wob = Math.sin(ang*5 + t*2.2 + phase*9)*4*(0.4+phase)
                  + Math.sin(ang*3 - t*1.4)*3*(0.4+phase);
        const rr = r + wob;
        const px = x + Math.cos(ang)*rr;
        const py = y + Math.sin(ang)*rr*squash;
        if(a===0)ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.stroke();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
    // 中央持续涟漪（5 圈循环扩散）
    for(let i=0;i<5;i++){
      const ph = (t*0.34 + i/5)%1;
      ring(W/2, cy, ph, i%2? blue : "#ffffff");
    }
    // 三处落珠点：周期性滴落产生扩散圈
    const drops = [
      {x:W*0.26, y:H*0.48, period:2.6, off:0.0},
      {x:W*0.76, y:H*0.62, period:3.1, off:1.1},
      {x:W*0.60, y:H*0.42, period:3.8, off:2.2}
    ];
    drops.forEach((d,k)=>{
      const ph = ((t + d.off) % d.period)/d.period;
      ring(d.x, d.y, ph, k===1? deep : blue);
      // 落珠亮点
      if(ph < 0.12){
        ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 1-ph/0.12;
        ctx.shadowColor = blue; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      }
    });
    // 中央亮核
    const g = ctx.createRadialGradient(W/2, cy, 0, W/2, cy, 46);
    g.addColorStop(0,"rgba(92,208,255,.5)"); g.addColorStop(1,"rgba(92,208,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(W/2, cy, 46, 46*squash, 0, 0, Math.PI*2); ctx.fill();
  },
  /* 透视粒子地形 */
  terrain(ctx,W,H,t){
    const rows=15, cols=64;
    for(let r=0;r<rows;r++){
      const d=r/(rows-1);
      const y0=H*0.30 + d*(H*0.58);
      for(let c=0;c<cols;c++){
        const x=(c/(cols-1))*W;
        const z=Math.sin(c*0.35 + t*2 + r*0.55)*(10+26*d) + Math.sin(c*0.09 - t*1.1 + r*0.2)*(6+10*d);
        const y=y0-z;
        ctx.fillStyle=getCss("--led3");
        ctx.globalAlpha=(.15+.85*d)*(.5+.5*Math.abs(Math.sin(c*0.5+t*3+r)));
        const s=1.2+2.2*d;
        ctx.fillRect(x,y,s,s);
      }
    }
    ctx.globalAlpha=1;
    const g=ctx.createLinearGradient(0,H*0.15,0,H*0.5);
    g.addColorStop(0,"rgba(92,208,255,0)"); g.addColorStop(1,"rgba(92,208,255,.12)");
    ctx.fillStyle=g; ctx.fillRect(0,H*0.15,W,H*0.35);
  },
  /* 双层镜像频谱山脉 */
  bars2(ctx,W,H,t){
    const bands=[
      {base:H*0.47, dir:-1, c1:"#8cff5c", c2:"rgba(20,90,40,.15)", ph:0},
      {base:H*0.53, dir:1,  c1:"#5cd0ff", c2:"rgba(20,50,110,.15)", ph:2.1}
    ];
    const bars=64, bw=W/bars;
    bands.forEach(B=>{
      for(let i=0;i<bars;i++){
        const v=(Math.sin(t*2.6+i*0.45+B.ph)*0.5+0.5)*(Math.sin(i*0.23+t*1.4+B.ph)*0.35+0.65)*(0.25+audioLevel*0.75);
        const h=Math.max(4,v*(H*0.36));
        const g=ctx.createLinearGradient(0,B.base,0,B.base+B.dir*h);
        g.addColorStop(0,B.c1); g.addColorStop(1,B.c2);
        ctx.fillStyle=g; ctx.globalAlpha=.9;
        ctx.fillRect(i*bw+1.5, B.dir<0? B.base-h : B.base, bw-3, h);
      }
    });
    ctx.globalAlpha=1;
  },
  /* 光带涟漪：交汇辉光波 + 星尘 */
  ribbon(ctx,W,H,t){
    for(let i=0;i<90;i++){
      const x=(i*97)%W, y=(i*61)%H;
      ctx.fillStyle=getCss("--bg"); ctx.globalAlpha=.2+.6*Math.abs(Math.sin(i+t*2));
      ctx.fillRect(x,y,2,2);
    }
    ctx.globalAlpha=1;
    for(let k=0;k<5;k++){
      const col=k%2? getCss("--led3"):getCss("--led1");
      ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur=16;
      ctx.lineWidth=Math.max(1,2.5-k*0.3); ctx.globalAlpha=.85-k*0.12;
      ctx.beginPath();
      for(let x=0;x<=W;x+=3){
        const env=Math.pow(Math.max(0,Math.sin((x/W)*Math.PI)),0.8)*(0.25+audioLevel*0.75);
        const y=H/2 + Math.sin(x*0.012 + t*(1.1+k*0.3) + k*1.2)*(20+75*env)*(0.55+0.45*Math.sin(k*0.9+t*0.4));
        if(x===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
  },
  /* 光环频谱：呼吸圆环 + 放射刻度 + 星尘（参考环形可视化） */
  ring(ctx,W,H,t){
    const cx=W/2, cy=H/2;
    const R = Math.min(W,H)*0.27;
    const cyan=getCss("--led3"), purple=getCss("--led1"), pink=getCss("--led2");
    // 星尘
    for(let i=0;i<80;i++){
      const x=(i*127)%W, y=(i*83)%H;
      ctx.fillStyle=cyan; ctx.globalAlpha=.1+.45*Math.abs(Math.sin(i*1.3+t*1.8));
      ctx.fillRect(x,y,2,2);
    }
    ctx.globalAlpha=1;
    // 外圈放射频谱刻度（长短随节拍呼吸）
    const ticks=84;
    for(let i=0;i<ticks;i++){
      const ang=(i/ticks)*Math.PI*2 - Math.PI/2;
      const v=Math.abs(Math.sin(i*1.7+t*3.1))*(.35+.65*Math.abs(Math.sin(i*.53+t*1.2)));
      const len=6+v*34*(0.3+audioLevel*0.9);
      const r0=R+16, r1=R+16+len;
      ctx.strokeStyle=i%7===0? pink : cyan;
      ctx.globalAlpha=.35+.55*v; ctx.lineWidth=i%7===0?2.4:1.4;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(ang)*r0, cy+Math.sin(ang)*r0);
      ctx.lineTo(cx+Math.cos(ang)*r1, cy+Math.sin(ang)*r1);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    // 主环：半径带波动（呼吸感），青色辉光
    function orbRing(base, wob, speed, col, lw, blur, ph){
      ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.shadowColor=col; ctx.shadowBlur=blur;
      ctx.globalAlpha=.92;
      ctx.beginPath();
      for(let a=0;a<=120;a++){
        const ang=(a/120)*Math.PI*2;
        const r=base + Math.sin(ang*5+t*speed+ph)*wob + Math.sin(ang*11-t*speed*1.4)*wob*.55;
        const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
        if(a===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath(); ctx.stroke();
      ctx.shadowBlur=0; ctx.globalAlpha=1;
    }
    orbRing(R*1.04, 7, 1.9, cyan, 3, 20, 0);
    orbRing(R*0.94, 5, 1.4, purple, 1.6, 12, 1.4);
    orbRing(R*1.12, 4, 0.9, pink, 1, 8, 2.8);
    // 中央光晕
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.8);
    g.addColorStop(0,"rgba(92,208,255,.16)"); g.addColorStop(1,"rgba(92,208,255,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R*.8,0,Math.PI*2); ctx.fill();
  },

  /* 波纹实时频谱：每个频段是一个独立波源，能量决定涟漪的扩散速度、半径与亮度；
     叠上频谱轮廓与水下倒影，波峰处溅出水花。数据来自 AnalyserNode，静音时自动回退模拟。 */
  rippleSpec(ctx,W,H,t){
    const bands = sampleSpectrumBands(t);
    const N = SPEC_BANDS;
    let dt = t - _lastSpecT; _lastSpecT = t;
    if(!(dt>0) || dt>0.12) dt = 1/60;      // 切模式回来时 t 会跳，夹一下

    const dark = canvasIsDark();
    const horizon = H*0.62;                // 水平线（水面）
    const squash  = 0.30;                  // 透视压缩：椭圆涟漪才像水面
    const maxR    = Math.min(W,H)*0.70;
    const bx  = (i)=> (i/(N-1))*W;
    const amp = (i)=> bands[i];
    const lift = (i)=> horizon - amp(i)*H*0.30;   // 该频段对应的水面高度
    const led3 = getCss("--led3"), led1 = getCss("--led1");
    // 画布底色 = --text，浅色主题下是深靛蓝、深色主题下是近白。深色主题里同样一笔淡彩
    // 落在白底上对比会掉一大截，所以结构性的填充/线条要补偿不透明度，线条改用 --bg 当墨色。
    const K   = dark ? 1 : 1.6;
    const ink = dark ? led3 : getCss("--bg");

    /* 频谱轮廓路径（只建路径，描边还是填充由调用方决定） */
    function buildOutline(scale, mirror){
      ctx.beginPath();
      ctx.moveTo(bx(0), horizon + (lift(0)-horizon)*scale*mirror);
      for(let i=0;i<N-1;i++){
        const y1 = horizon + (lift(i)-horizon)*scale*mirror;
        const y2 = horizon + (lift(i+1)-horizon)*scale*mirror;
        ctx.quadraticCurveTo(bx(i), y1, (bx(i)+bx(i+1))/2, (y1+y2)/2);
      }
      ctx.lineTo(bx(N-1), horizon + (lift(N-1)-horizon)*scale*mirror);
    }

    /* 1. 水面透视横纹 */
    for(let row=0; row<14; row++){
      const p = row/13;
      const y0 = horizon + p*(H-horizon)*0.95;
      ctx.strokeStyle = ink;
      ctx.globalAlpha = Math.min(1, ((dark?0.05:0.07) + (dark?0.10:0.09)*p) * K);
      ctx.lineWidth = 1;
      ctx.beginPath();
      for(let x=0;x<=W;x+=8){
        const y = y0 + Math.sin(x*0.021 + t*1.5 + row*1.1)*(1.5+5*p);
        if(x===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* 2. 水下倒影：频谱轮廓压缩后翻到水面之下 */
    buildOutline(0.52,-1);
    ctx.lineTo(bx(N-1), horizon); ctx.lineTo(bx(0), horizon); ctx.closePath();
    const rf = ctx.createLinearGradient(0, horizon, 0, H);
    rf.addColorStop(0, "rgba(124,92,255,"+Math.min(1,(dark?0.26:0.16)*K)+")");
    rf.addColorStop(1, "rgba(124,92,255,0)");
    ctx.fillStyle = rf; ctx.fill();
    buildOutline(0.52,-1);
    ctx.globalAlpha = Math.min(1, (dark?0.55:0.40)*K);
    ctx.lineWidth = 1.4; ctx.strokeStyle = led1;
    ctx.stroke();
    ctx.globalAlpha = 1;

    /* 3. 水体：轮廓到水平线之间填充 + 主轮廓线 */
    buildOutline(1,1);
    ctx.lineTo(bx(N-1), horizon); ctx.lineTo(bx(0), horizon); ctx.closePath();
    const wf = ctx.createLinearGradient(0, horizon-H*0.32, 0, horizon);
    wf.addColorStop(0, "rgba(92,208,255,"+Math.min(1,(dark?0.34:0.20)*K)+")");
    wf.addColorStop(1, "rgba(92,208,255,0.02)");
    ctx.fillStyle = wf; ctx.fill();
    buildOutline(1,1);
    ctx.globalAlpha = 0.95;
    ctx.lineWidth = 2.4;
    ctx.strokeStyle = led3;
    ctx.shadowColor = led3; ctx.shadowBlur = dark?16:8;
    ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;

    /* 4. 涟漪环：隔一个频段取一个波源（56→28），从该频段的水面高度扩散出去。
       扩散速度与亮度都 ∝ 该频段能量 —— 弹哪个音，涟漪就出现在哪个位置。 */
    const rings = [];
    for(let i=0;i<N;i++){
      const e = amp(i);
      _ringPh[i] = (_ringPh[i] + dt*(0.22 + e*1.5)) % 1;
      if(i%2) continue;
      if(e < 0.07) continue;
      rings.push({i:i, ph:_ringPh[i], e:e});
      if(e > 0.5) rings.push({i:i, ph:(_ringPh[i]+0.5)%1, e:e*0.6});   // 强频段多一圈
    }
    rings.sort((a,b)=> b.ph - a.ph);        // 远的先画，近的压在上面
    const ringN = Math.min(rings.length, 64);
    for(let k=0;k<ringN;k++){
      const r = rings[k], e = r.e, ph = r.ph;
      const a = Math.pow(1-ph,2.0) * (0.12 + 0.58*e) * (dark?1:1.3);
      if(a < 0.012) continue;
      const rad = 4 + ph*maxR*(0.5+0.5*e);
      const col = lerpColor(r.i/(N-1));
      const cy = lift(r.i) + 4;             // 涟漪贴着该频段的水面
      ctx.strokeStyle = rgba(col,1);
      ctx.globalAlpha = a;
      ctx.lineWidth = 0.7 + (1-ph)*1.7*(0.5+e*0.8);
      if(e > 0.7 && ph < 0.22){ ctx.shadowColor = rgba(col,.9); ctx.shadowBlur = 8; }  // 只给最新最亮的几圈上辉光
      ctx.beginPath();
      const seg = 36;
      for(let s=0;s<=seg;s++){
        const ang = (s/seg)*Math.PI*2;
        const wob = Math.sin(ang*5 + t*2.1 + _ringSeed[r.i])*3.4*(0.3+ph)
                  + Math.sin(ang*3 - t*1.3 + r.i)*2.4*(0.3+ph);
        const rr = rad + wob;
        const px = bx(r.i) + Math.cos(ang)*rr;
        const py = cy + Math.sin(ang)*rr*squash;
        if(s===0)ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;

    /* 5. 波峰水花：能量突起的频段溅出水珠 */
    for(let i=0;i<N;i++){
      const e = amp(i), d = e - _specPrev[i];
      if(d > 0.055 && e > 0.30 && _splash.length < 150){
        const cnt = Math.random()<0.45 ? 2 : 1;
        for(let k=0;k<cnt;k++){
          const life = 0.5+Math.random()*0.55;
          _splash.push({
            x: bx(i)+(Math.random()-0.5)*7, y: lift(i),
            vx:(Math.random()-0.5)*26, vy:-30-Math.random()*55,
            life:life, max:life, col:lerpColor(i/(N-1))
          });
        }
      }
      _specPrev[i] = e;
    }
    ctx.save();
    if(dark) ctx.globalCompositeOperation = "lighter";
    for(let k=_splash.length-1;k>=0;k--){
      const s = _splash[k];
      s.life -= dt;
      if(s.life<=0){ _splash.splice(k,1); continue; }
      s.vy += 150*dt; s.x += s.vx*dt; s.y += s.vy*dt;
      const a = s.life/s.max;
      ctx.globalAlpha = a*a*0.95;
      ctx.fillStyle = rgba(s.col,1);
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.1+a*1.7, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    /* 5. 能量核心辉光 */
    let tot=0; for(let i=0;i<N;i++) tot += amp(i);
    tot /= N;
    const R = 70 + tot*230;
    const cg = ctx.createRadialGradient(W*0.5, horizon, 0, W*0.5, horizon, R);
    cg.addColorStop(0, "rgba(92,208,255,"+(dark? (0.05+tot*0.22) : 0.10)+")");
    cg.addColorStop(1, "rgba(92,208,255,0)");
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.ellipse(W*0.5, horizon, R, R*squash, 0, 0, Math.PI*2); ctx.fill();

    /* 6. 数据来源指示：有真实音频是 LIVE，回退模拟是 SIM */
    const live = _specLive > 0.5;
    ctx.save();
    ctx.font = "9px \"Press Start 2P\", monospace";
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = live ? getCss("--led5") : getCss("--secondary");
    ctx.fillText(live? "● LIVE" : "● SIM", 14, 14);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
};

/* ---------------- 规划路线 ---------------- */
function renderPlan(){
  const phases = [
    { code:"A", name:"板子独立 Loop 钢琴", tag:"作业主体", desc:"发声→音色→循环叠录→灯反馈。所有 App 功能都建立在「事件数据模型」上，这个模型在写固件时就定型。也是作业主体。" },
    { code:"B", name:"USB 串口打通 + 最小镜像页", tag:"提交够用", desc:"第一个「哇」时刻，工作量小、成就感大；顺便定下通信协议（板子把按键/旋钮/层数/录循环变成事件发出）。" },
    { code:"C", name:"联动音频引擎 + 界面一完善", tag:"纯软件", desc:"有了事件流后：乐器显示、层控制、钢琴卷帘谱。电脑出好音色。" },
    { code:"D", name:"界面二可视化", tag:"最简单", desc:"频谱/波形/粒子。有音频数据后反而一两天就能出效果。" },
    { code:"E", name:"反向操控/浏览器烧录/蓝牙", tag:"锦上添花", desc:"屏幕反向控制板子、esptool-js 浏览器一键烧录、蓝牙连手机当 MIDI 控制器。放最后。" }
  ];
  const decisions = [
    { q:"录音是「记音符」还是「录真实声音」？", a:"推荐 MVP 用「记音符」：板子只记哪个键、第几秒、按了多久，回放重新合成。内存极小、音永远准、各层天然对齐。真录音 ESP32 存不了几秒还会糊。鼓点也用合成音。" },
    { q:"旋钮按下=录/停，那「清层 / 撤销」怎么触发？", a:"推荐：旋钮短按=录/停一层；旋钮长按=清掉最后一层（或全清）。RGB 灯提示当前状态。" },
    { q:"8 个键怎么又当琴键又当鼓？", a:"旋钮选到「鼓」模式时 8 键变 8 种鼓声（底鼓/军鼓/踩镲…）打节拍层；选到「钢琴/合成器」时 8 键变音阶。一物两用，呼应课程「8 键×应用=64 种」。" },
    { q:"节奏 / 速度？", a:"MVP 先固定 120 BPM、1 小节（2 秒）循环。速度调节以后再加。" },
    { q:"要不要节拍器？", a:"要。录第一层时给个「咔哒」声帮你踩准，录完可关。" }
  ];
  let h = '<section class="panel"><div class="toolbar"><div class="grow sec-label">ROADMAP · 制作路线（先跑通最小可用版）</div></div>';
  h += phases.map(p=>'<div class="roadmap-phase"><div class="rp-head"><span class="rp-code">'+p.code+'</span><span class="rp-name">'+p.name+'</span><span class="rp-tag">'+p.tag+'</span></div><div class="rp-desc">'+p.desc+'</div></div>').join("");
  h += '</section>';
  h += '<section class="panel"><div class="toolbar"><div class="grow sec-label">5 DECISIONS · 动手前必须先想清楚的决策</div><div class="hint">标注 REC 为规划推荐项</div></div>';
  h += decisions.map((d,i)=>'<div class="dec-item"><div class="dec-n">DECISION '+(i+1)+'</div><div class="dec-q">'+d.q+'<span class="tag-rec">REC</span></div><div class="dec-a">'+d.a+'</div></div>').join("");
  h += '</section>';
  h += '<section class="panel"><div class="toolbar"><div class="grow sec-label">TWO AUDIO MODES · 两种音频模式（规划灵魂）</div></div>'
    + '<div class="roadmap-phase"><div class="rp-head"><span class="rp-code">独立</span><span class="rp-name">独立模式</span></div><div class="rp-desc">板子自己合成出声，拔了电脑照样玩——这是作业主体，也是产品的「离线可用性」。</div></div>'
    + '<div class="roadmap-phase"><div class="rp-head"><span class="rp-code">联动</span><span class="rp-name">联动模式</span></div><div class="rp-desc">板子变身高品质 MIDI 控制器，只发事件不出声（或只出提示音），电脑负责出好听音色+可视化。同一固件两种模式共存，切换只是换「谁来出声」。</div></div>'
    + '</section>';
  h += '<section class="panel"><div class="toolbar"><div class="grow sec-label">ASSIGNMENT · 第八课作业策略</div></div>'
    + '<div class="rp-desc" style="line-height:1.8">'
    + '· 方向：走「基于现有开发板做功能延伸」——在 EasyInput 上加电子琴+实时循环录音（合规，且省解释）。<br>'
    + '· 及格（二元）：①说清「在 EasyInput 上<strong>加了</strong>电子琴+循环录音功能」；②有实现/成果交代（过程+视频或文字证据）。本点子天然覆盖，及格稳。<br>'
    + '· 加分点（满分 110，普通 1–24）：真实难题（循环对齐、实时音频合成）、创新点（8 键一物两用+旋钮按为录音）、复盘、把过程沉淀成文档。<br>'
    + '· 必交物：一个<strong>可公开访问的作品链接</strong>（飞书文档即可）——很多不及格就是没交链接。<br>'
    + '· 时间线：优秀学员 10/4 前（仅加分非门槛）；<strong>结业/及格 10/18 23:59 前</strong>。提交用 A+B 已非常够（板子独立 looper 主体 + 镜像页协同铁证）。'
    + '</div></section>';
  return h;
}

/* ---------------- 连接（模拟 Web Serial） ---------------- */
document.getElementById("connectBtn").addEventListener("click", ()=>{
  STATE.connected = !STATE.connected;
  const btn = document.getElementById("connectBtn");
  const pill = document.getElementById("connPill");
  const sbConn = document.getElementById("sbConnText");
  if(STATE.connected){
    btn.textContent = "断开"; btn.classList.add("on");
    pill.textContent = "● USB 已连接"; pill.classList.remove("off");
    sbConn.textContent = "USB 已连接"; document.getElementById("sbConn").classList.add("on");
    flash("已通过 Web Serial 连接板子（模拟）。真实环境：浏览器直连 USB，无需安装。");
  } else {
    btn.textContent = "连接板子"; btn.classList.remove("on");
    pill.textContent = "● 未连接"; pill.classList.add("off");
    sbConn.textContent = "未连接"; document.getElementById("sbConn").classList.remove("on");
    flash("已断开板子连接");
  }
});

/* ---------------- 导出规划（Markdown） ---------------- */
document.getElementById("exportBtn").addEventListener("click", ()=>{
  let md = "# EasyInput V2.0 Loop 钢琴 · 电脑端网页伴侣 App 规划\n\n";
  md += "> 由 EasyLoop 镜像台导出\n\n";
  md += "## 硬件（EasyInput V2.0 / ESP32-S3，无需新零件）\n";
  md += "- 8 独立按键 → 一个八度琴键（C D E F G A B C'）\n";
  md += "- 旋钮（可转可按压）→ 旋转切音色，按压=录/停一层\n";
  md += "- 板载扬声器 → 直接出声，不用连手机\n";
  md += "- 5 颗 RGB 灯 → 每颗对应一种乐器：旋钮转到哪个乐器，对应灯闪一下；录了哪层就常亮该乐器色，录制中闪烁\n";
  md += "- 麦克风 → 进阶录真声层\n\n";
  md += "## 制作路线（最小可用优先）\n";
  [["A","板子独立 Loop 钢琴（发声→音色→循环叠录→灯反馈）"],
   ["B","USB 串口打通 + 最小镜像页（按键亮灯）"],
   ["C","联动音频引擎 + 界面一完善（乐器/层控制/钢琴卷帘谱）"],
   ["D","界面二可视化（频谱/波形/粒子）"],
   ["E","反向操控/浏览器烧录/蓝牙扩展"]].forEach(p=>md+="- **"+p[0]+"** "+p[1]+"\n");
  md += "\n## 五个决策（推荐项）\n1. 录音用「记音符」而非录真实声音\n2. 旋钮短按=录/停一层，长按=清层\n3. 8 键一物两用：鼓模式→鼓声，琴模式→音阶\n4. MVP 固定 120 BPM、1 小节（2 秒）循环\n5. 要节拍器（录第一层给咔哒声，录完可关）\n\n";
  md += "## 两种音频模式\n- 独立模式：板子自己合成出声，离线可用（作业主体）\n- 联动模式：板子变 MIDI 控制器只发事件，电脑出音色+可视化\n\n";
  md += "## 作业策略\n- 方向：基于现有开发板做功能延伸（合规）\n- 及格：说清加了功能 + 有实现/成果证据（A+B 已够）\n- 必交：可公开访问作品链接（飞书文档）\n- 截止：优秀 10/4（加分），结业/及格 10/18 23:59\n";
  const blob = new Blob([md], {type:"text/markdown;charset=utf-8"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="EasyLoop规划.md"; a.click();
  URL.revokeObjectURL(a.href);
  flash("已导出规划 Markdown");
});

/* ---------------- 提示 ---------------- */
function flash(msg){
  const el=document.getElementById("footMsg"); el.textContent=msg; el.classList.add("ok");
  clearTimeout(flash._t); flash._t=setTimeout(()=>{ el.classList.remove("ok"); el.textContent="就绪。点击琴键可发声并高亮（实时镜像演示）；点「连接板子」模拟 Web Serial 串口连接。"; },2600);
}

/* 同步底部状态 */
function syncStatus(){
  document.getElementById("sbInst").textContent = "乐器 "+INSTRUMENTS[STATE.inst];
  document.getElementById("sbLayer").textContent = "层数 "+STATE.layers+"/5";
}

/* ---------------- 空格 = 播放 / 暂停 ---------------- */
document.addEventListener("keydown", (e)=>{
  if(e.code!=="Space" && e.key!==" ") return;
  const t = e.target;
  // 正在输入曲名时不抢空格
  if(t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.isContentEditable)) return;
  e.preventDefault();   // 顺带挡掉「焦点在按钮上时空格再触发一次 click」
  if(STATE.playing) pausePlayback();
  else startPlayback();
});

/* ---------------- 启动 ---------------- */
(function init(){
  let t="light"; try{ t=localStorage.getItem("easyloop_theme")||"light"; }catch(e){}
  applyTheme(t);
  loadPreviewLoop();
  renderMain();
  syncStatus();
  if(STATE.previewLoaded){
    // 预置曲 12.9 秒，默认 zoom(140px/s) 只能看到前 6 秒，首屏直接按「适应全曲」铺满
    zoomFit();
    flash("已预置示例 loop（蓝调八小节 · 3 层），点 ▶ 播放即可试听");
  }
})();
</script>
